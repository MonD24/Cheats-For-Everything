<style>
:root{
  --bg:#0d0f14; --panel:#151922; --panel2:#1b2030; --line:#262c3d; --text:#e6e9f2; --dim:#8a93a8;
  --accent:#7c5cff; --accent2:#22d3ee; --ok:#34d399; --warn:#fbbf24; --bad:#f87171;
}
*{box-sizing:border-box} html,body{height:100%;margin:0}
body{background:radial-gradient(1200px 600px at 10% -10%,#1d1640 0,transparent 60%),var(--bg);
  color:var(--text);font:14px/1.5 Inter,system-ui,sans-serif;display:grid;grid-template-rows:auto 1fr;}
header{display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:1px solid var(--line);background:rgba(13,15,20,.7);backdrop-filter:blur(8px)}
.logo{font-weight:700;font-size:16px;letter-spacing:.2px}
.logo b{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;color:transparent}
.pill{font-size:12px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.spacer{flex:1}
select,input,button,textarea{font:inherit;color:var(--text)}
select,input{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
button{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:linear-gradient(90deg,var(--accent),#5b8cff);border:0;font-weight:600}
main{display:grid;grid-template-columns:280px 1fr 340px;gap:14px;padding:14px;min-height:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;min-height:0}
.card h3{margin:0;padding:12px 14px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);border-bottom:1px solid var(--line)}
.scroll{overflow:auto;min-height:0;flex:1}
#gameSearch{margin:10px;width:calc(100% - 20px)}
.game{padding:8px 14px;cursor:pointer;border-left:3px solid transparent;display:flex;justify-content:space-between;gap:8px}
.game:hover{background:var(--panel2)} .game.sel{border-left-color:var(--accent);background:var(--panel2)}
.game small{color:var(--dim)}
.gameinfo{padding:12px 14px;border-top:1px solid var(--line);font-size:13px}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;margin:2px 4px 2px 0}
.b-ok{background:rgba(52,211,153,.12);color:var(--ok)} .b-bad{background:rgba(248,113,113,.12);color:var(--bad)}
.b-dim{background:var(--panel2);color:var(--dim)}
#chat{padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:85%;padding:10px 14px;border-radius:14px;white-space:pre-wrap;word-wrap:break-word}
.user{align-self:flex-end;background:linear-gradient(135deg,#3b2d8f,#2a3a8a)}
.assistant{align-self:flex-start;background:var(--panel2);border:1px solid var(--line)}
.tool{align-self:flex-start;font:12px 'JetBrains Mono',monospace;color:var(--dim);padding:4px 10px;border-radius:8px;border:1px dashed var(--line);max-width:95%}
.tool.err{color:var(--bad);border-color:rgba(248,113,113,.4)}
.tool b{color:var(--accent2);font-weight:600}
.thinking{align-self:flex-start;color:var(--dim);font-style:italic}
.queued{border:1px dashed var(--accent2)}
.queued small{display:block;color:var(--accent2);font-size:11px;margin-top:4px}
.composer button.stop{border-color:var(--bad);color:var(--bad)}
.thinking::after{content:'';animation:dots 1.2s infinite}
@keyframes dots{0%{content:''}33%{content:'.'}66%{content:'..'}100%{content:'...'}}
.composer{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.composer textarea{flex:1;resize:none;height:46px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.quick{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 12px}
.quick button{font-size:12px;padding:4px 10px;border-radius:999px}
.cheat{margin:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
.cheat .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.key{font:600 12px 'JetBrains Mono',monospace;background:#0b0d12;border:1px solid var(--line);border-bottom-width:3px;border-radius:6px;padding:2px 7px}
.cheat .meta{color:var(--dim);font-size:12px;margin:4px 0 8px;font-family:'JetBrains Mono',monospace;word-break:break-all}
.cheat .row{display:flex;gap:6px} .cheat .row button{font-size:12px;padding:4px 10px}
.empty{color:var(--dim);padding:20px 14px;text-align:center}
.build{padding:12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
#buildOut{font:12px 'JetBrains Mono',monospace;color:var(--dim);word-break:break-all}
@media (max-width:1100px){main{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="logo"><img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA1MTIgNTEyIiB3aWR0aD0iNTEyIiBoZWlnaHQ9IjUxMiI+CiAgPGRlZnM+CiAgICA8bGluZWFyR3JhZGllbnQgaWQ9ImJnIiB4MT0iMCIgeTE9IjAiIHgyPSIxIiB5Mj0iMSI+CiAgICAgIDxzdG9wIG9mZnNldD0iMCIgc3RvcC1jb2xvcj0iIzdjNWNmZiIvPgogICAgICA8c3RvcCBvZmZzZXQ9IjEiIHN0b3AtY29sb3I9IiMzZmE5ZjUiLz4KICAgIDwvbGluZWFyR3JhZGllbnQ+CiAgICA8bGluZWFyR3JhZGllbnQgaWQ9Imxvb3AiIHgxPSIwIiB5MT0iMCIgeDI9IjEiIHkyPSIwIj4KICAgICAgPHN0b3Agb2Zmc2V0PSIwIiBzdG9wLWNvbG9yPSIjN2M1Y2ZmIi8+CiAgICAgIDxzdG9wIG9mZnNldD0iMSIgc3RvcC1jb2xvcj0iIzNmYTlmNSIvPgogICAgPC9saW5lYXJHcmFkaWVudD4KICA8L2RlZnM+CiAgPHJlY3QgeD0iMTYiIHk9IjE2IiB3aWR0aD0iNDgwIiBoZWlnaHQ9IjQ4MCIgcng9IjExMiIgZmlsbD0idXJsKCNiZykiLz4KICA8IS0tIGdhbWVwYWQgLS0+CiAgPHBhdGggZD0iTTE1MCAyMDAgQzE1MCAxNzAgMTc0IDE1MiAyMDQgMTUyIEwzMDggMTUyIEMzMzggMTUyIDM2MiAxNzAgMzYyIDIwMAogICAgICAgICAgIEwzOTIgMzMwIEM0MDEgMzcxIDM2OCAzOTYgMzM4IDM3OCBMMzAwIDM1MiBMMjEyIDM1MiBMMTc0IDM3OCBDMTQ0IDM5NiAxMTEgMzcxIDEyMCAzMzAgWiIKICAgICAgICBmaWxsPSIjZmZmZmZmIi8+CiAgPCEtLSBpbmZpbml0eSBpbiBwbGFjZSBvZiB0aGUgYnV0dG9uczogY2hlYXRzIGZvciBldmVyeXRoaW5nIC0tPgogIDxwYXRoIGQ9Ik0yNTYgMjU0IEMyMzYgMjI2IDE5MiAyMjYgMTkyIDI1NCBDMTkyIDI4MiAyMzYgMjgyIDI1NiAyNTQgQzI3NiAyMjYgMzIwIDIyNiAzMjAgMjU0IEMzMjAgMjgyIDI3NiAyODIgMjU2IDI1NCBaIgogICAgICAgIGZpbGw9Im5vbmUiIHN0cm9rZT0idXJsKCNsb29wKSIgc3Ryb2tlLXdpZHRoPSIyMCIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIiBzdHJva2UtbGluZWpvaW49InJvdW5kIi8+Cjwvc3ZnPgo=" alt="" style="width:22px;height:22px;vertical-align:-5px;margin-right:8px"><b>Cheats</b> For Everything</div>
  <span class="pill" id="status">локальная модель</span>
  <div class="spacer"></div>
  <label class="pill">модель</label>
  <select id="model"></select>
  <button id="reset" title="Начать разговор заново">Новый диалог</button>
</header>
<main>
  <section class="card">
    <h3>Игры</h3>
    <input id="gameSearch" placeholder="Поиск или путь к exe/папке…">
    <div class="scroll" id="games"><div class="empty">Загружаю библиотеку…</div></div>
    <div class="gameinfo" id="gameInfo"><span style="color:var(--dim)">Игра не выбрана</span></div>
  </section>

  <section class="card">
    <h3>Агент</h3>
    <div class="scroll" id="chatWrap"><div id="chat"></div></div>
    <div class="quick" id="quick">
      <button>Сделай трейнер сам и собери релиз</button>
      <button>Хочу бесконечное здоровье</button><button>Хочу много денег</button>
      <button>Бесконечные патроны</button><button>Посмотри на экран игры</button>
    </div>
    <div class="composer">
      <textarea id="input" placeholder="Напишите, что нужно… (Enter — отправить)"></textarea>
      <button id="interrupt" class="stop" title="Остановить текущий проход после текущего ответа/действия и обработать это сообщение первым">Стоп + отправить</button>
      <button class="primary" id="send">Отправить</button>
    </div>
  </section>

  <section class="card">
    <h3>Трейнер</h3>
    <div class="scroll" id="cheats"><div class="empty">Читы появятся здесь</div></div>
    <div class="build">
      <button class="primary" id="build">Собрать .exe</button>
      <button id="openDist">Открыть папку с трейнером</button>
      <div id="buildOut"></div>
    </div>
  </section>
</main>
<script>
const $ = s => document.querySelector(s);
const api = (p, body) => fetch(p, body ? {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)} : {}).then(r => r.json());
const esc = s => String(s ?? '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let state = {}, games = [], lastChat = null;

async function loadGames(){
  const r = await api('/api/games'); games = r.games || []; renderGames();
}
function renderGames(){
  const q = $('#gameSearch').value.toLowerCase();
  const sel = state.game && state.game.name;
  const list = games.filter(g => g.name.toLowerCase().includes(q));
  $('#games').innerHTML = list.length ? list.map(g =>
    `<div class="game ${g.name===sel?'sel':''}" data-name="${esc(g.name)}"><span>${esc(g.name)}</span><small>${esc(g.store)}</small></div>`
  ).join('') : `<div class="empty">Нет совпадений.<br>Enter — выбрать как путь</div>`;
}
$('#games').onclick = async e => {
  const el = e.target.closest('.game'); if(!el) return;
  $('#gameInfo').innerHTML = '<span style="color:var(--dim)">Проверяю игру…</span>';
  await api('/api/select', {name: el.dataset.name}); refresh();
};
$('#gameSearch').oninput = renderGames;
$('#gameSearch').onkeydown = async e => {
  if(e.key === 'Enter' && /[\\/:]/.test(e.target.value)){ await api('/api/select', {path: e.target.value}); refresh(); }
};

function renderGame(g){
  if(!g){ $('#gameInfo').innerHTML = '<span style="color:var(--dim)">Игра не выбрана</span>'; return; }
  const ac = g.blocked ? `<span class="badge b-bad">⛔ ${esc(g.blocked)}</span>` : '<span class="badge b-ok">✓ можно делать трейнер</span>';
  $('#gameInfo').innerHTML = `<div style="font-weight:600;margin-bottom:4px">${esc(g.name)}</div>
    ${ac}<span class="badge b-dim">${esc(g.engine || 'движок ?')}</span>
    <div style="color:var(--dim);font-size:12px;margin-top:6px">процесс: ${esc(g.process || 'не определён — запустите игру')}</div>`;
}

function renderChat(){
  const html = (state.chat || []).map(m => {
    if(m.role === 'tool') return `<div class="tool ${m.ok===false?'err':''}"><b>${esc(m.tool)}</b> ${esc(JSON.stringify(m.args||{}))}<br>→ ${esc(m.summary)}</div>`;
    const queueLabel = m.interrupt ? 'остановка запрошена · следующее сообщение' :
      (m.hint_saved ? 'подсказка сохранена для этой игры · в очереди' : 'в очереди');
    return `<div class="msg ${m.role} ${m.queued?'queued':''}">${esc(m.text)}${m.queued?`<small>${queueLabel}</small>`:''}</div>`;
  }).join('') + (state.busy ? `<div class="thinking">${state.interrupt_requested?'останавливаю текущий проход':'агент работает'}${state.queued?` · сообщений в очереди: ${state.queued}`:''}</div>` : '');
  if(html !== lastChat){ $('#chat').innerHTML = html || '<div class="empty">Выберите игру слева и напишите, что хотите — агент сам спросит детали.</div>';
    lastChat = html; $('#chatWrap').scrollTop = 1e9; }
}

function renderCheats(){
  const cs = state.cheats || [];
  $('#cheats').innerHTML = cs.length ? cs.map(c => {
    const t = c.target || {}; const where = t.aob ? 'AOB '+t.aob : t.module ? `${t.module}+${t.offset}${(t.pointers||[]).length?' → '+t.pointers.join(' → '):''}` : (t.address||'');
    const what = c.type==='patch' ? `patch ${c.bytes}` : `${c.type} ${c.value_type} = ${c.value}`;
    return `<div class="cheat"><div class="top"><b>${esc(c.name)}</b><span class="key">${esc(c.hotkey)}</span></div>
      <div class="meta">${esc(what)}<br>${esc(where)}</div>
      <div class="row"><button data-act="test" data-name="${esc(c.name)}">Проверить в игре</button>
      <button data-act="remove" data-name="${esc(c.name)}">Удалить</button></div></div>`;
  }).join('') : '<div class="empty">Читы появятся здесь</div>';
}
$('#cheats').onclick = async e => {
  const b = e.target.closest('button'); if(!b) return;
  const r = await api('/api/' + (b.dataset.act === 'test' ? 'test' : 'remove'), {name: b.dataset.name});
  $('#buildOut').textContent = JSON.stringify(r); refresh();
};

async function refresh(){
  state = await api('/api/state');
  $('#status').textContent = state.busy ? `агент работает${state.queued?` · очередь ${state.queued}`:''}` : 'готов · ' + state.model;
  $('#reset').disabled = state.busy;
  $('#interrupt').disabled = !state.busy;
  renderGame(state.game); renderChat(); renderCheats(); renderGames();
}
async function send(text, interrupt=false){
  text = (text ?? $('#input').value).trim(); if(!text) return;
  const result = await api('/api/chat', {text, interrupt});
  if(result.error){ $('#status').textContent = result.error; return; }
  $('#input').value = ''; refresh();
}
$('#send').onclick = () => send();
$('#interrupt').onclick = () => send(undefined, true);
$('#input').onkeydown = e => { if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(); } };
$('#quick').onclick = e => { if(e.target.tagName === 'BUTTON') send(e.target.textContent); };
$('#reset').onclick = async () => { await api('/api/reset', {}); lastChat=''; refresh(); };
$('#build').onclick = async () => { $('#buildOut').textContent = 'Собираю… (до минуты)'; const r = await api('/api/build', {}); $('#buildOut').textContent = r.exe ? '✓ ' + r.exe : (r.error || r.log); };
$('#openDist').onclick = () => state.dist && api('/api/open', {path: state.dist});
$('#model').onchange = e => api('/api/model', {model: e.target.value}).then(refresh);

(async () => {
  const m = await api('/api/models');
  $('#model').innerHTML = (m.models.length ? m.models : [m.current]).map(x => `<option ${x===m.current?'selected':''}>${esc(x)}</option>`).join('');
  if(!m.models.length) $('#status').textContent = '⚠ LM Studio не отвечает (localhost:1234)';
  refresh(); loadGames(); setInterval(refresh, 1200);
})();
</script>
</body>
</html>
